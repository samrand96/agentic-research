# Codex settings for THIS project (plug-ins, also called MCP servers).
# Codex reads this file only after you mark the project folder as trusted.
# Keys are NOT written here: "env_vars" passes them in from your environment variables.
# Where to get each key: setup-guides/08-api-keys.md
# Docs: https://learn.chatgpt.com/docs/extend/mcp

[mcp_servers.paper-search]
command = "uvx"
args = ["paper-search-mcp"]
env_vars = [
  "PAPER_SEARCH_MCP_UNPAYWALL_EMAIL",
  "PAPER_SEARCH_MCP_SEMANTIC_SCHOLAR_API_KEY",
  "PAPER_SEARCH_MCP_CORE_API_KEY",
  "PAPER_SEARCH_MCP_OPENALEX_API_KEY",
  "PAPER_SEARCH_MCP_OPENALEX_EMAIL",
  "PAPER_SEARCH_MCP_WOS_API_KEY",
  "PAPER_SEARCH_MCP_SCOPUS_API_KEY",
  "PAPER_SEARCH_MCP_IEEE_API_KEY",
]

[mcp_servers.zotero]
command = "zotero-mcp"
args = []

[mcp_servers.zotero.env]
ZOTERO_LOCAL = "true"
